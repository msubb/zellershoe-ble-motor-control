<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZellerShoe Motor</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101820;
        color: #f7f5ef;
      }

      main {
        width: min(94vw, 620px);
      }

      h1 {
        margin: 0 0 24px;
        font-size: 28px;
        font-weight: 750;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .link-row {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #dbe5ec;
        font-size: 15px;
        font-weight: 700;
      }

      .link-row input {
        width: 20px;
        height: 20px;
        accent-color: #16c172;
      }

      .shoes {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .shoe {
        min-width: 0;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 20px;
      }

      .value {
        font-size: 56px;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 18px;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #16c172;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 18px;
      }

      label {
        display: block;
        margin: 18px 0 8px;
        color: #b8c7d1;
        font-size: 14px;
        font-weight: 650;
      }

      input[type="number"] {
        width: 100%;
        box-sizing: border-box;
        min-height: 52px;
        border: 1px solid #445563;
        border-radius: 8px;
        background: #17242d;
        color: #f7f5ef;
        font-size: 20px;
        font-weight: 700;
        padding: 0 14px;
      }

      button {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 8px;
        background: #16c172;
        color: #07120c;
        font-size: 17px;
        font-weight: 700;
      }

      button.secondary {
        background: #283845;
        color: #f7f5ef;
      }

      button.stop {
        background: #ff5a5f;
        color: #160406;
      }

      .status {
        min-height: 24px;
        margin-top: 16px;
        color: #b8c7d1;
        font-size: 15px;
      }

      @media (max-width: 560px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .shoes {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <h1>ZellerShoe Motor</h1>
        <label class="link-row">
          <input id="linkToggle" type="checkbox">
          Link controls
        </label>
      </div>

      <div class="shoes">
        <section class="shoe" data-shoe="left">
          <h2>Left</h2>
          <div class="value"><span data-role="powerText">0</span>%</div>
          <label>Power</label>
          <input data-role="powerSlider" type="range" min="0" max="255" value="0">
          <label>PWM value, 0-255</label>
          <input data-role="powerNumber" type="number" min="0" max="255" value="0" inputmode="numeric">
          <button data-role="connectButton">Connect Left</button>
          <div data-role="status" class="status">Disconnected</div>
        </section>

        <section class="shoe" data-shoe="right">
          <h2>Right</h2>
          <div class="value"><span data-role="powerText">0</span>%</div>
          <label>Power</label>
          <input data-role="powerSlider" type="range" min="0" max="255" value="0">
          <label>PWM value, 0-255</label>
          <input data-role="powerNumber" type="number" min="0" max="255" value="0" inputmode="numeric">
          <button data-role="connectButton">Connect Right</button>
          <div data-role="status" class="status">Disconnected</div>
        </section>
      </div>

      <div class="controls">
        <button id="startButton">Start</button>
        <button id="stopButton" class="stop">Stop</button>
      </div>
    </main>

    <script>
      const serviceUuid = "19b10000-e8f2-537e-4f6c-d104768a1214";
      const powerUuid = "19b10001-e8f2-537e-4f6c-d104768a1214";

      const linkToggle = document.querySelector("#linkToggle");
      const startButton = document.querySelector("#startButton");
      const stopButton = document.querySelector("#stopButton");

      let lastNonZeroPower = 128;
      let running = false;
      const shoes = {};

      function clampPower(value) {
        const parsed = Number.parseInt(value, 10);
        if (Number.isNaN(parsed)) return 0;
        return Math.max(0, Math.min(255, parsed));
      }

      function percentFromPower(value) {
        return Math.round((Number(value) / 255) * 100);
      }

      function makeShoe(section) {
        const id = section.dataset.shoe;
        return {
          id,
          deviceName: id === "left" ? "ZellerShoe-L" : "ZellerShoe-R",
          device: null,
          characteristic: null,
          slider: section.querySelector('[data-role="powerSlider"]'),
          numberInput: section.querySelector('[data-role="powerNumber"]'),
          powerText: section.querySelector('[data-role="powerText"]'),
          connectButton: section.querySelector('[data-role="connectButton"]'),
          statusText: section.querySelector('[data-role="status"]')
        };
      }

      function renderPower(shoe) {
        shoe.powerText.textContent = percentFromPower(shoe.slider.value);
        shoe.numberInput.value = shoe.slider.value;
      }

      async function writePower(shoe, value) {
        if (!shoe.characteristic) return;
        const data = new Uint8Array([clampPower(value)]);
        await shoe.characteristic.writeValue(data);
      }

      async function setShoePower(shoe, value, shouldRun = running) {
        const power = clampPower(value);
        shoe.slider.value = power;
        shoe.numberInput.value = power;

        if (power > 0) lastNonZeroPower = power;
        renderPower(shoe);

        if (shouldRun) {
          await writePower(shoe, power);
        }
      }

      async function setBothPower(value, shouldRun = running) {
        await Promise.all(Object.values(shoes).map((shoe) => setShoePower(shoe, value, shouldRun)));
      }

      async function connectShoe(shoe) {
        try {
          shoe.statusText.textContent = "Choosing device...";
          const device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: "ZellerShoe" }],
            optionalServices: [serviceUuid]
          });

          device.addEventListener("gattserverdisconnected", () => {
            shoe.device = null;
            shoe.characteristic = null;
            shoe.statusText.textContent = "Disconnected";
          });

          shoe.statusText.textContent = "Connecting...";
          const server = await device.gatt.connect();
          const service = await server.getPrimaryService(serviceUuid);
          shoe.device = device;
          shoe.characteristic = await service.getCharacteristic(powerUuid);

          const name = device.name || "unknown device";
          shoe.statusText.textContent = name === shoe.deviceName ? "Connected" : `Connected to ${name}`;
          if (running) await writePower(shoe, shoe.slider.value);
        } catch (error) {
          shoe.statusText.textContent = error.message;
        }
      }

      document.querySelectorAll(".shoe").forEach((section) => {
        const shoe = makeShoe(section);
        shoes[shoe.id] = shoe;

        shoe.connectButton.addEventListener("click", () => connectShoe(shoe));

        shoe.slider.addEventListener("input", async () => {
          try {
            if (linkToggle.checked) {
              await setBothPower(shoe.slider.value);
            } else {
              await setShoePower(shoe, shoe.slider.value);
            }
          } catch (error) {
            shoe.statusText.textContent = error.message;
          }
        });

        shoe.numberInput.addEventListener("change", async () => {
          try {
            if (linkToggle.checked) {
              await setBothPower(shoe.numberInput.value);
            } else {
              await setShoePower(shoe, shoe.numberInput.value);
            }
          } catch (error) {
            shoe.statusText.textContent = error.message;
          }
        });

        renderPower(shoe);
      });

      startButton.addEventListener("click", async () => {
        running = true;
        await Promise.all(Object.values(shoes).map(async (shoe) => {
          const power = clampPower(shoe.slider.value) || lastNonZeroPower;
          await setShoePower(shoe, power, true);
          shoe.statusText.textContent = shoe.characteristic ? "Running" : "Set power, not connected";
        }));
      });

      stopButton.addEventListener("click", async () => {
        running = false;
        await Promise.all(Object.values(shoes).map(async (shoe) => {
          await writePower(shoe, 0);
          shoe.statusText.textContent = shoe.characteristic ? "Stopped" : "Stopped, not connected";
        }));
      });
    </script>
  </body>
</html>
