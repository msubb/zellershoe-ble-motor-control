<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZellerShoe Motor</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101820;
        color: #f7f5ef;
      }

      main {
        width: min(92vw, 420px);
      }

      h1 {
        margin: 0 0 24px;
        font-size: 28px;
        font-weight: 750;
      }

      .value {
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 18px;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #16c172;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 18px;
      }

      label {
        display: block;
        margin: 18px 0 8px;
        color: #b8c7d1;
        font-size: 14px;
        font-weight: 650;
      }

      input[type="number"] {
        width: 100%;
        box-sizing: border-box;
        min-height: 52px;
        border: 1px solid #445563;
        border-radius: 8px;
        background: #17242d;
        color: #f7f5ef;
        font-size: 20px;
        font-weight: 700;
        padding: 0 14px;
      }

      button {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 8px;
        background: #16c172;
        color: #07120c;
        font-size: 17px;
        font-weight: 700;
      }

      button.secondary {
        background: #283845;
        color: #f7f5ef;
      }

      button.stop {
        background: #ff5a5f;
        color: #160406;
      }

      .status {
        min-height: 24px;
        margin-top: 16px;
        color: #b8c7d1;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ZellerShoe Motor</h1>
      <div class="value"><span id="powerText">0</span>%</div>
      <label for="powerSlider">Power</label>
      <input id="powerSlider" type="range" min="0" max="255" value="0">
      <label for="powerNumber">PWM value, 0-255</label>
      <input id="powerNumber" type="number" min="0" max="255" value="0" inputmode="numeric">
      <button id="connectButton">Connect</button>
      <div class="controls">
        <button id="startButton">Start</button>
        <button id="stopButton" class="stop">Stop</button>
      </div>
      <div id="status" class="status">Disconnected</div>
    </main>

    <script>
      const serviceUuid = "19b10000-e8f2-537e-4f6c-d104768a1214";
      const powerUuid = "19b10001-e8f2-537e-4f6c-d104768a1214";

      const slider = document.querySelector("#powerSlider");
      const numberInput = document.querySelector("#powerNumber");
      const powerText = document.querySelector("#powerText");
      const connectButton = document.querySelector("#connectButton");
      const startButton = document.querySelector("#startButton");
      const stopButton = document.querySelector("#stopButton");
      const statusText = document.querySelector("#status");

      let powerCharacteristic = null;
      let lastNonZeroPower = 128;
      let running = false;

      function clampPower(value) {
        const parsed = Number.parseInt(value, 10);
        if (Number.isNaN(parsed)) return 0;
        return Math.max(0, Math.min(255, parsed));
      }

      function percentFromPower(value) {
        return Math.round((Number(value) / 255) * 100);
      }

      function renderPower() {
        powerText.textContent = percentFromPower(slider.value);
        numberInput.value = slider.value;
      }

      async function writePower(value) {
        if (!powerCharacteristic) return;
        const data = new Uint8Array([clampPower(value)]);
        await powerCharacteristic.writeValue(data);
      }

      async function setPower(value, shouldRun = running) {
        const power = clampPower(value);
        slider.value = power;
        numberInput.value = power;

        if (power > 0) lastNonZeroPower = power;
        renderPower();

        if (shouldRun) {
          await writePower(power);
        }
      }

      connectButton.addEventListener("click", async () => {
        try {
          statusText.textContent = "Choosing device...";
          const device = await navigator.bluetooth.requestDevice({
            filters: [{ name: "ZellerShoe" }],
            optionalServices: [serviceUuid]
          });

          device.addEventListener("gattserverdisconnected", () => {
            powerCharacteristic = null;
            statusText.textContent = "Disconnected";
          });

          statusText.textContent = "Connecting...";
          const server = await device.gatt.connect();
          const service = await server.getPrimaryService(serviceUuid);
          powerCharacteristic = await service.getCharacteristic(powerUuid);

          statusText.textContent = "Connected";
          if (running) await writePower(slider.value);
        } catch (error) {
          statusText.textContent = error.message;
        }
      });

      slider.addEventListener("input", async () => {
        try {
          await setPower(slider.value);
        } catch (error) {
          statusText.textContent = error.message;
        }
      });

      numberInput.addEventListener("change", async () => {
        try {
          await setPower(numberInput.value);
        } catch (error) {
          statusText.textContent = error.message;
        }
      });

      startButton.addEventListener("click", async () => {
        running = true;
        const power = clampPower(slider.value) || lastNonZeroPower;
        await setPower(power, true);
        statusText.textContent = powerCharacteristic ? "Running" : "Set power, not connected";
      });

      stopButton.addEventListener("click", async () => {
        running = false;
        await writePower(0);
        statusText.textContent = powerCharacteristic ? "Stopped" : "Stopped, not connected";
      });

      renderPower();
    </script>
  </body>
</html>
